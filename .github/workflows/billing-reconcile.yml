name: Billing reconcile

# Penjadwal rekonsiliasi pembayaran: jaring pengaman bila webhook Mayar hilang.
#
# Tiap 15 menit fungsi ini memanggil Edge Function `billing-reconcile` yang:
#   1. menurunkan langganan premium yang sudah lewat masa berlaku,
#   2. menutup order pending yang menggantung (>24 jam),
#   3. menanyakan ulang status invoice ke Mayar dan memenuhi order yang
#      ternyata sudah dibayar (idempoten — tidak mungkin kredit ganda).
#
# Token bersama disimpan sebagai secret (sama nilainya dengan
# BILLING_RECONCILE_TOKEN di Supabase). Tanpa token yang cocok,
# endpoint menolak permintaan (fail-closed).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: billing-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil billing-reconcile
        run: |
          response=$(curl -sS -f --max-time 120 \
            -X POST \
            -H "x-reconcile-token: ${{ secrets.BILLING_RECONCILE_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_FUNCTIONS_URL || 'https://fqegthhmjidcagbapaes.supabase.co' }}/functions/v1/billing-reconcile")
          echo "Response: $response"
