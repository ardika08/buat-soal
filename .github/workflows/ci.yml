name: CI

# Gate rilis: install bersih, lint, uji keamanan kredit/pembayaran, build, dan audit dependency.
# Seluruh uji billing/keamanan berjalan di Postgres lokal (PGlite), jadi tidak butuh
# Supabase, jaringan, maupun Docker — CI bisa membuktikan migration benar tanpa layanan luar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # `npm ci` (bukan `npm install`) sengaja dipakai: perintah ini gagal bila
      # package.json dan package-lock.json tidak sinkron, sehingga lockfile yang
      # rusak ketahuan di CI, bukan saat deploy produksi.
      - name: Install dependencies (lockfile harus sinkron)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: Security & billing tests (PGlite)
        run: npm test

      # Ambang `high`: kerentanan high/critical menggagalkan gate, sedangkan low/moderate
      # yang belum ada perbaikinya tidak memblokir rilis.
      - name: Audit dependency produksi
        run: npm audit --omit=dev --audit-level=high
